<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wavvy</title>
    <link rel="stylesheet" href="receiver.css">
    <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body class="loading">
    <!-- The media element of the framework, it plays the sound and has no picture of its own -->
    <cast-media-player id="media"></cast-media-player>

    <!-- A tiny copy of the cover stretched behind everything, which is what blurs it, with a dark fade over it -->
    <canvas id="backdrop" width="64" height="36"></canvas>
    <div id="shade"></div>

    <main id="player">
        <div id="cover-box"><img id="cover" alt=""></div>

        <section id="panel">
            <!-- The name and under it the artist, or the wait message while the player loads -->
            <div id="info">
                <h1 id="title" class="marquee"><span class="run"></span></h1>
                <p id="artist">
                    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    <span id="artist-name" class="marquee"><span class="run"></span></span>
                </p>
                <div id="loading">
                    <div class="dots"><span></span><span></span><span></span></div>
                    <p id="loading-text"></p>
                </div>
            </div>

            <!-- The bar with its knob and under it the time that went and the length of the song, the remote walks over the bar and the controls -->
            <div id="progress">
                <div id="bar"><div id="fill"></div><div id="knob"></div></div>
                <div id="times">
                    <span id="current">0:00</span>
                    <span id="total">0:00</span>
                </div>
            </div>

            <!-- Controls, all of the same kind, the one the remote is on gets a circle -->
            <div id="controls">
                <button class="control" data-action="shuffle" aria-label="Shuffle">
                    <svg class="edge line" viewBox="0 0 24 24"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></svg>
                </button>
                <button class="control" data-action="previous" aria-label="Previous">
                    <svg class="skip solid" viewBox="0 0 24 24"><path d="M19 20 9 12l10-8z"/><path d="M5 19V5"/></svg>
                </button>
                <button class="control" data-action="toggle" aria-label="Play">
                    <svg class="main solid" id="icon-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z"/></svg>
                    <span id="icon-pause"><i></i><i></i></span>
                </button>
                <button class="control" data-action="next" aria-label="Next">
                    <svg class="skip solid" viewBox="0 0 24 24"><path d="m5 4 10 8-10 8z"/><path d="M19 5v14"/></svg>
                </button>
                <button class="control" data-action="repeat" data-mode="off" aria-label="Repeat">
                    <svg class="edge line icon-repeat" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
                    <svg class="edge line icon-repeat-one" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/><path d="M11 10h1v4"/></svg>
                </button>
            </div>
        </section>
    </main>

    <script src="receiver.js"></script>
</body>
</html>
