<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wavvy</title>
    <link rel="stylesheet" href="receiver.css">
    <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body>
    <!-- Blurred cover behind everything -->
    <div id="backdrop"></div>

    <main id="player">
        <img id="cover" alt="" hidden>

        <h1 id="title"></h1>
        <p id="artist"></p>

        <!-- Controls, the remote walks over them and the bar -->
        <div id="controls">
            <button class="control" data-action="previous" aria-label="Previous">
                <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 18V6z"/></svg>
            </button>
            <button class="control" data-action="repeat" aria-label="Repeat">
                <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg>
            </button>
            <button class="control main" data-action="toggle" aria-label="Play">
                <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg id="icon-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
            </button>
            <button class="control" data-action="shuffle" aria-label="Shuffle">
                <svg viewBox="0 0 24 24"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04z"/></svg>
            </button>
            <button class="control" data-action="next" aria-label="Next">
                <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zM16 6h2v12h-2z"/></svg>
            </button>
        </div>

        <!-- Time, bar and total time -->
        <div id="progress">
            <span id="current">0:00</span>
            <div id="bar"><div id="fill"></div></div>
            <span id="total">0:00</span>
        </div>
    </main>

    <script src="receiver.js"></script>
</body>
</html>
